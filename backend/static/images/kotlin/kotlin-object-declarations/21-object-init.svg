<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" width="800" height="392" role="img" aria-label="三种 object 的初始化时机时间轴：对象表达式执行到该处立即初始化，对象声明首次被访问时懒加载初始化，伴生对象随外部类加载时初始化">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <text x="44" y="56" fill="#1c1917" font-size="20" font-family="'Instrument Serif',Georgia,'Times New Roman',serif">三种 object 的初始化时机</text>

  <line x1="72" y1="184" x2="728" y2="184" stroke="#57534e" stroke-width="1"/>

  <line x1="160" y1="180" x2="160" y2="152" stroke="#57534e" stroke-width="1"/>
  <line x1="400" y1="180" x2="400" y2="152" stroke="#57534e" stroke-width="1"/>
  <line x1="640" y1="180" x2="640" y2="152" stroke="#57534e" stroke-width="1"/>

  <line x1="160" y1="188" x2="160" y2="216" stroke="#57534e" stroke-width="1"/>
  <line x1="400" y1="188" x2="400" y2="216" stroke="#57534e" stroke-width="1"/>
  <line x1="640" y1="188" x2="640" y2="216" stroke="#57534e" stroke-width="1"/>

  <circle cx="160" cy="184" r="4" fill="#1c1917"/>
  <circle cx="400" cy="184" r="4" fill="#1c1917"/>
  <circle cx="640" cy="184" r="4" fill="#1c1917"/>

  <text x="160" y="144" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">对象表达式</text>
  <text x="400" y="144" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">对象声明</text>
  <text x="640" y="144" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">伴生对象</text>

  <text x="160" y="228" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">执行到该处立即初始化</text>
  <text x="160" y="248" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">每次执行都创建新实例</text>
  <text x="400" y="228" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">首次被访问时初始化</text>
  <text x="400" y="248" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">懒加载，全局唯一</text>
  <text x="640" y="228" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">外部类加载时初始化</text>
  <text x="640" y="248" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">等同 Java 静态初始化器</text>

  <path d="M400 276 V288 H640 V276" fill="none" stroke="#b5523a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="520" y="316" fill="#b5523a" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">一个懒加载，一个随类加载</text>

  <text x="400" y="352" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">轴为概念示意，刻度之间不是时间先后关系</text>
</svg>
