<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="值类的装箱与不装箱时机：直接作为具体类型使用时零开销，用作可空、泛型、接口或集合元素时会被装箱">
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
</pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
</marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
</marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="#faf7f2"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

<text x="40" y="36" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" letter-spacing="0.18em">KOTLIN · VALUE CLASS</text>
<text x="40" y="60" fill="#1c1917" font-size="20" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">值类：何时装箱，何时不装箱</text>
<line x1="40" y1="76" x2="840" y2="76" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>

<!-- connectors -->
<line x1="440" y1="176" x2="440" y2="208" stroke="#57534e" stroke-width="1"/>
<line x1="200" y1="208" x2="680" y2="208" stroke="#57534e" stroke-width="1"/>
<line x1="200" y1="208" x2="200" y2="244" stroke="#b5523a" stroke-width="1" marker-end="url(#arrow-accent)"/>
<line x1="680" y1="208" x2="680" y2="244" stroke="#57534e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<line x1="200" y1="352" x2="200" y2="388" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="680" y1="384" x2="680" y2="420" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

<!-- top: value class declaration (focal) -->
<rect x="280" y="104" width="320" height="72" rx="6" fill="#faf7f2"/>
<rect x="280" y="104" width="320" height="72" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
<rect x="288" y="112" width="72" height="12" rx="2" fill="transparent" stroke="rgba(181,82,58,0.50)" stroke-width="0.8"/>
<text x="324" y="121" fill="#b5523a" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">VALUE CLASS</text>
<text x="440" y="152" fill="#1c1917" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">@JvmInline value class UserId(val id: Int)</text>

<!-- left branch: unboxed -->
<rect x="40" y="248" width="320" height="104" rx="6" fill="#faf7f2"/>
<rect x="40" y="248" width="320" height="104" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<rect x="48" y="256" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
<text x="76" y="265" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">UNBOXED</text>
<text x="200" y="292" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">不装箱</text>
<text x="200" y="316" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">直接用作 UserId 类型</text>
<text x="200" y="332" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">作为函数参数与返回值</text>

<!-- right branch: boxed -->
<rect x="520" y="248" width="320" height="136" rx="6" fill="#faf7f2"/>
<rect x="520" y="248" width="320" height="136" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
<rect x="528" y="256" width="48" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
<text x="552" y="265" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">BOXED</text>
<text x="680" y="292" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">装箱</text>
<text x="680" y="314" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">可空类型 UserId?</text>
<text x="680" y="328" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">泛型类型参数 T</text>
<text x="680" y="342" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">实现接口之后</text>
<text x="680" y="356" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">放进集合</text>

<!-- left result -->
<rect x="40" y="392" width="320" height="64" rx="6" fill="#faf7f2"/>
<rect x="40" y="392" width="320" height="64" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
<rect x="48" y="400" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
<text x="76" y="409" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
<text x="200" y="436" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">运行时就是 Int</text>

<!-- right result -->
<rect x="520" y="424" width="320" height="64" rx="6" fill="#faf7f2"/>
<rect x="520" y="424" width="320" height="64" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
<rect x="528" y="432" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
<text x="556" y="441" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
<text x="680" y="468" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">包装成对象</text>

<!-- bottom note -->
<text x="440" y="528" fill="#57534e" font-size="12" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" text-anchor="middle">值类的意义：零开销的类型安全包装</text>
</svg>
