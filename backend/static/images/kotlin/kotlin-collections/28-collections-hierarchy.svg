<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="840" height="480" role="img" aria-label="Kotlin 集合接口层次：Iterable 到 Collection 再到 List 与 Set，Map 独立成一支，各自都有可变版本">
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
</pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
</marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
</marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="#faf7f2"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

<text x="40" y="36" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" letter-spacing="0.18em">KOTLIN · COLLECTIONS</text>
<text x="40" y="60" fill="#1c1917" font-size="20" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Kotlin 集合接口层次</text>
<line x1="40" y1="76" x2="800" y2="76" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>

<!-- tree divider -->
<line x1="540" y1="96" x2="540" y2="400" stroke="rgba(28,25,23,0.12)" stroke-width="1" stroke-dasharray="4,4"/>

<!-- connectors (drawn before nodes) -->
<line x1="280" y1="144" x2="280" y2="176" stroke="#57534e" stroke-width="1"/>
<line x1="280" y1="224" x2="280" y2="240" stroke="#57534e" stroke-width="1"/>
<line x1="160" y1="240" x2="400" y2="240" stroke="#57534e" stroke-width="1"/>
<line x1="160" y1="240" x2="160" y2="256" stroke="#57534e" stroke-width="1"/>
<line x1="400" y1="240" x2="400" y2="256" stroke="#57534e" stroke-width="1"/>
<line x1="160" y1="304" x2="160" y2="344" stroke="#57534e" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="400" y1="304" x2="400" y2="344" stroke="#57534e" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="680" y1="144" x2="680" y2="176" stroke="#57534e" stroke-width="1" stroke-dasharray="4,3"/>

<!-- mutable conversion labels -->
<text x="172" y="328" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace">toMutableList()</text>
<text x="412" y="328" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace">toMutableSet()</text>
<text x="692" y="164" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace">toMutableMap()</text>

<!-- left tree -->
<rect x="200" y="96" width="160" height="48" rx="6" fill="#faf7f2"/>
<rect x="200" y="96" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<text x="280" y="125" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Iterable</text>

<rect x="200" y="176" width="160" height="48" rx="6" fill="#faf7f2"/>
<rect x="200" y="176" width="160" height="48" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
<text x="280" y="205" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Collection</text>

<rect x="80" y="256" width="160" height="48" rx="6" fill="#faf7f2"/>
<rect x="80" y="256" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<text x="160" y="285" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">List</text>

<rect x="320" y="256" width="160" height="48" rx="6" fill="#faf7f2"/>
<rect x="320" y="256" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<text x="400" y="285" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Set</text>

<rect x="80" y="344" width="160" height="48" rx="6" fill="#faf7f2"/>
<rect x="80" y="344" width="160" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
<text x="160" y="373" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">MutableList</text>

<rect x="320" y="344" width="160" height="48" rx="6" fill="#faf7f2"/>
<rect x="320" y="344" width="160" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
<text x="400" y="373" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">MutableSet</text>

<!-- right tree: Map, independent -->
<rect x="600" y="96" width="160" height="48" rx="6" fill="#faf7f2"/>
<rect x="600" y="96" width="160" height="48" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
<text x="680" y="125" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Map</text>

<rect x="600" y="176" width="160" height="48" rx="6" fill="#faf7f2"/>
<rect x="600" y="176" width="160" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
<text x="680" y="205" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">MutableMap</text>

<!-- bottom note -->
<text x="420" y="440" fill="#57534e" font-size="12" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" text-anchor="middle">Map 独立于 Collection，不继承 Iterable。</text>
</svg>
