<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="属性委托的编译期翻译：源码 var p by Delegate 被编译器展开为辅助属性 p$delegate 与 get set 访问器">
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
</pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
</marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
</marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="#faf7f2"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

<text x="40" y="36" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" letter-spacing="0.18em">KOTLIN · PROPERTY DELEGATION</text>
<text x="40" y="60" fill="#1c1917" font-size="20" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">编译器如何翻译属性委托</text>
<line x1="40" y1="76" x2="720" y2="76" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>

<!-- connectors -->
<line x1="240" y1="196" x2="360" y2="196" stroke="#57534e" stroke-width="1"/>
<line x1="360" y1="136" x2="360" y2="256" stroke="#57534e" stroke-width="1"/>
<line x1="360" y1="136" x2="392" y2="136" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="360" y1="256" x2="392" y2="256" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

<!-- arrow label -->
<rect x="260" y="176" width="80" height="16" fill="#faf7f2"/>
<text x="300" y="187" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">COMPILER</text>

<!-- left: source -->
<rect x="40" y="152" width="200" height="88" rx="6" fill="#faf7f2"/>
<rect x="40" y="152" width="200" height="88" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<rect x="48" y="160" width="44" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
<text x="70" y="169" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
<text x="56" y="196" fill="#1c1917" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace">var p: String</text>
<text x="56" y="216" fill="#1c1917" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace">by Delegate()</text>

<!-- right top: helper property (focal) -->
<rect x="400" y="104" width="320" height="64" rx="6" fill="#faf7f2"/>
<rect x="400" y="104" width="320" height="64" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
<rect x="408" y="112" width="48" height="12" rx="2" fill="transparent" stroke="rgba(181,82,58,0.50)" stroke-width="0.8"/>
<text x="432" y="121" fill="#b5523a" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HELPER</text>
<text x="416" y="148" fill="#1c1917" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace">private val p$delegate = Delegate()</text>

<!-- annotation under helper -->
<text x="560" y="192" fill="#b5523a" font-size="12" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">编译器生成的辅助属性</text>

<!-- right bottom: accessors -->
<rect x="400" y="208" width="320" height="96" rx="6" fill="#faf7f2"/>
<rect x="400" y="208" width="320" height="96" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<rect x="408" y="216" width="64" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
<text x="440" y="225" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ACCESSORS</text>
<text x="416" y="252" fill="#1c1917" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace">get() = p$delegate.getValue(this, ::p)</text>
<text x="416" y="276" fill="#1c1917" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace">set(v) = p$delegate.setValue(this, ::p, v)</text>
</svg>
