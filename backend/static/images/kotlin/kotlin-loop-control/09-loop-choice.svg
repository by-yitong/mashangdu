<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 704" width="880" height="704" role="img" aria-label="循环写法选择流程图：次数或遍历对象已知用 for，条件驱动可能一次都不执行用 while，条件驱动至少执行一次用 do...while；break 结束整个循环，continue 跳过本次，标签可作用于外层循环">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <text x="48" y="48" fill="#78716c" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" letter-spacing="0.18em">KOTLIN LOOP CONTROL</text>
  <text x="48" y="92" fill="#1c1917" font-size="28" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">循环写法选择</text>
  <text x="48" y="124" fill="#57534e" font-size="12" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif">先看重复次数是否已知，再决定用哪种循环</text>

  <line x1="440" y1="224" x2="440" y2="256" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="336" y1="328" x2="168" y2="368" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="440" y1="328" x2="440" y2="368" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="544" y1="328" x2="712" y2="368" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="160" y1="456" x2="160" y2="496" stroke="#57534e" stroke-width="1"/>
  <line x1="440" y1="456" x2="440" y2="496" stroke="#57534e" stroke-width="1"/>
  <line x1="720" y1="456" x2="720" y2="496" stroke="#57534e" stroke-width="1"/>
  <line x1="160" y1="496" x2="720" y2="496" stroke="#57534e" stroke-width="1"/>
  <line x1="440" y1="496" x2="440" y2="512" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="352" y="168" width="176" height="56" rx="6" fill="#faf7f2"/>
  <rect x="352" y="168" width="176" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="360" y="176" width="40" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="380" y="185" fill="#57534e" font-size="8" font-family="'Geist Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">START</text>
  <text x="440" y="208" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, Arial, sans-serif" text-anchor="middle">需要重复执行</text>

  <rect x="320" y="264" width="240" height="64" rx="6" fill="#faf7f2"/>
  <rect x="320" y="264" width="240" height="64" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <rect x="328" y="272" width="56" height="12" rx="2" fill="transparent" stroke="rgba(181,82,58,0.40)" stroke-width="0.8"/>
  <text x="356" y="281" fill="#b5523a" font-size="8" font-family="'Geist Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DECIDE</text>
  <text x="440" y="308" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, Arial, sans-serif" text-anchor="middle">重复次数或遍历对象已知？</text>

  <rect x="72" y="376" width="176" height="80" rx="6" fill="#faf7f2"/>
  <rect x="72" y="376" width="176" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="80" y="384" width="24" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="92" y="393" fill="#57534e" font-size="8" font-family="'Geist Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FOR</text>
  <text x="160" y="416" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, Arial, sans-serif" text-anchor="middle">for (i in ...)</text>
  <text x="160" y="436" fill="#57534e" font-size="9" font-family="'Geist Mono', Menlo, Consolas, monospace" text-anchor="middle">遍历集合 / 区间</text>

  <rect x="352" y="376" width="176" height="80" rx="6" fill="#faf7f2"/>
  <rect x="352" y="376" width="176" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="360" y="384" width="40" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="380" y="393" fill="#57534e" font-size="8" font-family="'Geist Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">WHILE</text>
  <text x="440" y="416" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, Arial, sans-serif" text-anchor="middle">while (条件)</text>
  <text x="440" y="436" fill="#57534e" font-size="9" font-family="'Geist Mono', Menlo, Consolas, monospace" text-anchor="middle">可能一次都不执行</text>

  <rect x="632" y="376" width="176" height="80" rx="6" fill="#faf7f2"/>
  <rect x="632" y="376" width="176" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="640" y="384" width="48" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="664" y="393" fill="#57534e" font-size="8" font-family="'Geist Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DO</text>
  <text x="720" y="416" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, Arial, sans-serif" text-anchor="middle">do...while</text>
  <text x="720" y="436" fill="#57534e" font-size="9" font-family="'Geist Mono', Menlo, Consolas, monospace" text-anchor="middle">至少执行一次</text>

  <rect x="232" y="520" width="416" height="64" rx="6" fill="#faf7f2"/>
  <rect x="232" y="520" width="416" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="240" y="528" width="48" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="264" y="537" fill="#57534e" font-size="8" font-family="'Geist Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CONTROL</text>
  <text x="440" y="556" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, Arial, sans-serif" text-anchor="middle">break 与 continue 对三种循环都适用</text>
  <text x="440" y="572" fill="#57534e" font-size="9" font-family="'Geist Mono', Menlo, Consolas, monospace" text-anchor="middle">break 结束整个循环，continue 跳过本次</text>

  <rect x="232" y="608" width="416" height="64" rx="6" fill="#faf7f2"/>
  <rect x="232" y="608" width="416" height="64" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="440" y="636" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, Arial, sans-serif" text-anchor="middle">标签让跳转作用于外层循环</text>
  <text x="440" y="656" fill="#57534e" font-size="9" font-family="'Geist Mono', Menlo, Consolas, monospace" text-anchor="middle">break@loop 一次跳出多层嵌套</text>
</svg>
