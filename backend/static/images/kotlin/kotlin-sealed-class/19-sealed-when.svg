<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" width="800" height="488" role="img" aria-label="密封类层次与 when 穷尽性：sealed class RunoobResult 有 Success、Failure、Loading 三个子类，when 覆盖全部子类时不需要 else">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <text x="44" y="56" fill="#1c1917" font-size="20" font-family="'Instrument Serif',Georgia,'Times New Roman',serif">密封类层次与 when 穷尽性</text>

  <path d="M220 144 V168 H120 V368 H140" fill="none" stroke="#57534e" stroke-width="1"/>
  <path d="M120 224 H140" fill="none" stroke="#57534e" stroke-width="1"/>
  <path d="M120 296 H140" fill="none" stroke="#57534e" stroke-width="1"/>

  <line x1="520" y1="224" x2="300" y2="224" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="296" x2="300" y2="296" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="368" x2="300" y2="368" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="100" y="80" width="240" height="64" rx="6" fill="#faf7f2"/>
  <rect x="100" y="80" width="240" height="64" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <rect x="108" y="88" width="48" height="16" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="132" y="100" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">SEALED</text>
  <text x="220" y="120" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">sealed class RunoobResult</text>
  <text x="220" y="136" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">密封类层次</text>

  <rect x="140" y="200" width="160" height="48" rx="6" fill="#faf7f2"/>
  <rect x="140" y="200" width="160" height="48" rx="6" fill="#ffffff" stroke="#57534e" stroke-width="1"/>
  <text x="220" y="220" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Success</text>
  <text x="220" y="236" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">: RunoobResult</text>

  <rect x="140" y="272" width="160" height="48" rx="6" fill="#faf7f2"/>
  <rect x="140" y="272" width="160" height="48" rx="6" fill="#ffffff" stroke="#57534e" stroke-width="1"/>
  <text x="220" y="292" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Failure</text>
  <text x="220" y="308" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">: RunoobResult</text>

  <rect x="140" y="344" width="160" height="48" rx="6" fill="#faf7f2"/>
  <rect x="140" y="344" width="160" height="48" rx="6" fill="#ffffff" stroke="#57534e" stroke-width="1"/>
  <text x="220" y="364" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Loading</text>
  <text x="220" y="380" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">: RunoobResult</text>

  <rect x="520" y="184" width="240" height="232" rx="6" fill="#faf7f2"/>
  <rect x="520" y="184" width="240" height="232" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="528" y="192" width="40" height="16" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="548" y="204" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">WHEN</text>
  <text x="536" y="228" fill="#1c1917" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">Success -&gt; ...</text>
  <text x="536" y="300" fill="#1c1917" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">Failure -&gt; ...</text>
  <text x="536" y="372" fill="#1c1917" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">Loading -&gt; ...</text>

  <text x="640" y="448" fill="#b5523a" font-size="16" font-style="italic" font-family="'Instrument Serif',Georgia,'Times New Roman',serif" text-anchor="middle">覆盖全部子类 → 不需要 else</text>
</svg>
