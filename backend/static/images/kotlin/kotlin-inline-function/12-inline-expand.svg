<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" role="img" aria-label="内联函数的编译期展开：调用处 main() 调用 inline fun log，编译期把函数体搬进调用处，展开为直接调用 println，不再有额外函数对象；底部虚线小注说明非内联版本会为 lambda 生成函数对象">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <text x="48" y="44" fill="#1c1917" font-size="20" font-family="'Instrument Serif',Georgia,'Times New Roman',serif">内联函数的编译期展开</text>

  <!-- 编译期箭头（accent） -->
  <line x1="304" y1="204" x2="576" y2="204" stroke="#b5523a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="396" y="196" width="88" height="16" fill="#faf7f2"/>
  <text x="440" y="208" fill="#b5523a" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">COMPILE TIME</text>

  <!-- 调用处 -->
  <rect x="48" y="112" width="256" height="80" rx="6" fill="#faf7f2"/>
  <rect x="48" y="112" width="256" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="56" y="120" width="68" height="16" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="90" y="132" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">CALL SITE</text>
  <text x="176" y="156" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">调用处</text>
  <text x="176" y="172" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">main() { log("hi") }</text>

  <!-- 函数定义 -->
  <rect x="48" y="216" width="256" height="80" rx="6" fill="#faf7f2"/>
  <rect x="48" y="216" width="256" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="56" y="224" width="72" height="16" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="92" y="236" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">INLINE FUN</text>
  <text x="176" y="260" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">函数定义</text>
  <text x="176" y="276" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">inline fun log(s: String) { println(s) }</text>

  <!-- 展开后：焦点 -->
  <rect x="576" y="160" width="256" height="88" rx="6" fill="#faf7f2"/>
  <rect x="576" y="160" width="256" height="88" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
  <rect x="584" y="168" width="60" height="16" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="614" y="180" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">EXPANDED</text>
  <text x="704" y="208" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">main() { println("hi") }</text>
  <text x="704" y="224" fill="#57534e" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">展开后的调用处</text>
  <text x="704" y="272" fill="#57534e" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">函数体被搬进调用处，无额外函数对象</text>

  <!-- 底部虚线小注 -->
  <rect x="48" y="344" width="784" height="48" rx="6" fill="#faf7f2"/>
  <rect x="48" y="344" width="784" height="48" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="64" y="360" width="68" height="16" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="98" y="372" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">NO INLINE</text>
  <text x="148" y="372" fill="#57534e" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif">非内联版本会为 lambda 生成函数对象，每次调用多一次开销</text>
</svg>
