<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-label="协程挂起与恢复时序图：主线程 launch 协程，调用挂起函数后线程被释放，IO 线程发起网络请求，返回后恢复协程，主线程继续执行">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <text x="40" y="44" fill="#1c1917" font-size="20" font-family="'Instrument Serif',Georgia,'Times New Roman',serif">协程的挂起与恢复</text>
  <text x="840" y="44" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="end" letter-spacing="0.08em">SUSPEND / RESUME</text>

  <line x1="120" y1="128" x2="120" y2="456" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="440" y1="128" x2="440" y2="456" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="760" y1="128" x2="760" y2="456" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="116" y="168" width="8" height="80" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="0.8"/>
  <rect x="116" y="352" width="8" height="80" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="0.8"/>
  <rect x="436" y="200" width="8" height="160" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="0.8"/>
  <rect x="756" y="272" width="8" height="56" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="0.8"/>

  <path d="M 120 160 H 168 V 176 H 124" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="172" y="160" width="40" height="16" fill="#faf7f2"/>
  <text x="176" y="172" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">launch</text>

  <line x1="124" y1="208" x2="436" y2="208" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="244" y="188" width="72" height="16" fill="#faf7f2"/>
  <text x="280" y="200" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">fetchData()</text>

  <line x1="104" y1="252" x2="136" y2="252" stroke="#b5523a" stroke-width="1.2"/>
  <rect x="144" y="236" width="96" height="16" fill="#faf7f2"/>
  <text x="148" y="248" fill="#b5523a" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="0.08em">THREAD RELEASED</text>

  <line x1="444" y1="280" x2="756" y2="280" stroke="#2563eb" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="560" y="260" width="80" height="16" fill="#faf7f2"/>
  <text x="600" y="272" fill="#2563eb" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">HTTP GET</text>

  <line x1="756" y1="320" x2="444" y2="320" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
  <rect x="568" y="300" width="64" height="16" fill="#faf7f2"/>
  <text x="600" y="312" fill="#2563eb" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">200 OK</text>

  <line x1="436" y1="352" x2="124" y2="352" stroke="#57534e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="248" y="332" width="64" height="16" fill="#faf7f2"/>
  <text x="280" y="344" fill="#57534e" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">返回结果</text>

  <line x1="104" y1="384" x2="136" y2="384" stroke="#b5523a" stroke-width="1.2"/>
  <rect x="144" y="368" width="72" height="16" fill="#faf7f2"/>
  <text x="148" y="380" fill="#b5523a" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="0.08em">RESUMED</text>

  <path d="M 120 416 H 168 V 432 H 124" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="172" y="416" width="48" height="16" fill="#faf7f2"/>
  <text x="176" y="428" fill="#57534e" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif">继续执行</text>

  <rect x="40" y="64" width="160" height="64" rx="6" fill="#faf7f2"/>
  <rect x="40" y="64" width="160" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="48" y="72" width="48" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="72" y="80" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
  <text x="120" y="100" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">主线程</text>
  <text x="120" y="116" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">Dispatchers.Main</text>

  <rect x="360" y="64" width="160" height="64" rx="6" fill="#faf7f2"/>
  <rect x="360" y="64" width="160" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="368" y="72" width="48" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="392" y="80" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
  <text x="440" y="100" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">IO 线程</text>
  <text x="440" y="116" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">Dispatchers.IO</text>

  <rect x="680" y="64" width="160" height="64" rx="6" fill="#faf7f2"/>
  <rect x="680" y="64" width="160" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="688" y="72" width="48" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="712" y="80" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
  <text x="760" y="100" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">网络请求</text>
  <text x="760" y="116" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">HTTP / Retrofit</text>
</svg>
