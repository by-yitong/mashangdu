<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="Kotlin 类初始化顺序：主构造器参数求值、属性初始化与 init 块按书写顺序交错执行、次构造器体、对象可用">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <text x="44" y="56" fill="#1c1917" font-size="20" font-family="'Instrument Serif',Georgia,'Times New Roman',serif">Kotlin 类初始化顺序</text>

  <line x1="320" y1="160" x2="320" y2="200" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="320" y1="312" x2="320" y2="352" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="320" y1="416" x2="320" y2="456" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="292" y="164" width="56" height="20" fill="#faf7f2"/>
  <rect x="284" y="316" width="72" height="20" fill="#faf7f2"/>
  <rect x="292" y="420" width="56" height="20" fill="#faf7f2"/>
  <text x="320" y="172" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">参数就绪</text>
  <text x="320" y="324" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">若有次构造器</text>
  <text x="320" y="428" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">返回实例</text>

  <path d="M444 264 L484 236" fill="none" stroke="#57534e" stroke-width="1"/>
  <text x="492" y="232" fill="#1c1917" font-size="12" font-style="italic" font-family="'Instrument Serif',Georgia,'Times New Roman',serif">属性初始化与 init 块按书写顺序交错</text>
  <text x="492" y="252" fill="#1c1917" font-size="12" font-style="italic" font-family="'Instrument Serif',Georgia,'Times New Roman',serif">不是先全部属性再全部 init</text>

  <rect x="200" y="96" width="240" height="64" rx="6" fill="#faf7f2"/>
  <rect x="200" y="96" width="240" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="208" y="104" width="40" height="16" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="228" y="116" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="320" y="136" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">主构造器参数求值</text>
  <text x="320" y="152" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">primary constructor</text>

  <rect x="200" y="200" width="240" height="112" rx="6" fill="#faf7f2"/>
  <rect x="200" y="200" width="240" height="112" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <rect x="208" y="208" width="40" height="16" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="228" y="220" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="320" y="240" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">属性初始化与 init 块</text>
  <rect x="220" y="252" width="96" height="40" rx="4" fill="#ffffff" stroke="#57534e" stroke-width="1"/>
  <text x="268" y="276" fill="#1c1917" font-size="12" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">属性初始化器</text>
  <rect x="324" y="252" width="96" height="40" rx="4" fill="#ffffff" stroke="#57534e" stroke-width="1"/>
  <text x="372" y="276" fill="#1c1917" font-size="12" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">init 块</text>
  <text x="320" y="304" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">按书写顺序交错执行</text>

  <rect x="200" y="352" width="240" height="64" rx="6" fill="#faf7f2"/>
  <rect x="200" y="352" width="240" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="208" y="360" width="40" height="16" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="228" y="372" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="320" y="392" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">次构造器体</text>
  <text x="320" y="408" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">secondary constructor</text>

  <rect x="200" y="456" width="240" height="64" rx="6" fill="#faf7f2"/>
  <rect x="200" y="456" width="240" height="64" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <rect x="208" y="464" width="40" height="16" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="228" y="476" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">END</text>
  <text x="320" y="496" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">对象可用</text>
  <text x="320" y="512" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">instance ready</text>
</svg>
