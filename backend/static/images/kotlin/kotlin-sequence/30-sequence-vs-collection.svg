<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="集合的立即求值与序列的惰性求值对比：集合链每一步生成新集合，序列链元素逐个流过并在 first 处短路">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <text x="40" y="44" fill="#1c1917" font-size="20" font-family="'Instrument Serif',Georgia,'Times New Roman',serif">集合 vs 序列：求值时机对比</text>
  <text x="40" y="64" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="0.08em">IMMEDIATE VS LAZY EVALUATION</text>

  <line x1="184" y1="140" x2="208" y2="140" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="352" y1="140" x2="376" y2="140" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="140" x2="544" y2="140" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="184" y1="260" x2="208" y2="260" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="352" y1="260" x2="376" y2="260" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="260" x2="544" y2="260" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="40" y1="320" x2="688" y2="320" stroke="#b5523a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <text x="40" y="96" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="0.08em">COLLECTION / 立即求值</text>
  <text x="40" y="216" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="0.08em">SEQUENCE / 惰性求值</text>

  <rect x="40" y="112" width="144" height="56" rx="6" fill="#faf7f2"/>
  <rect x="40" y="112" width="144" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="48" y="120" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="76" y="128" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
  <text x="112" y="144" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">listOf(1..100)</text>
  <text x="112" y="160" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">List&lt;Int&gt;</text>

  <rect x="208" y="112" width="144" height="56" rx="6" fill="#faf7f2"/>
  <rect x="208" y="112" width="144" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="216" y="120" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="244" y="128" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="280" y="144" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">map</text>
  <text x="280" y="160" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">List&lt;Int&gt;</text>

  <rect x="376" y="112" width="144" height="56" rx="6" fill="#faf7f2"/>
  <rect x="376" y="112" width="144" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="384" y="120" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="412" y="128" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="448" y="144" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">filter</text>
  <text x="448" y="160" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">List&lt;Int&gt;</text>

  <rect x="544" y="112" width="144" height="56" rx="6" fill="#faf7f2"/>
  <rect x="544" y="112" width="144" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <rect x="552" y="120" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="580" y="128" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">TERM</text>
  <text x="616" y="144" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">first</text>
  <text x="616" y="160" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">Int</text>

  <line x1="112" y1="168" x2="112" y2="176" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <text x="112" y="192" fill="#57534e" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">生成新集合</text>
  <line x1="280" y1="168" x2="280" y2="176" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <text x="280" y="192" fill="#57534e" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">生成新集合</text>
  <line x1="448" y1="168" x2="448" y2="176" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <text x="448" y="192" fill="#57534e" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">生成新集合</text>

  <rect x="40" y="232" width="144" height="56" rx="6" fill="#faf7f2"/>
  <rect x="40" y="232" width="144" height="56" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <rect x="48" y="240" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="76" y="248" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
  <text x="112" y="264" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">asSequence()</text>
  <text x="112" y="280" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">Sequence&lt;Int&gt;</text>

  <rect x="208" y="232" width="144" height="56" rx="6" fill="#faf7f2"/>
  <rect x="208" y="232" width="144" height="56" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <rect x="216" y="240" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="244" y="248" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="280" y="264" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">map</text>
  <text x="280" y="280" fill="#57534e" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">未执行</text>

  <rect x="376" y="232" width="144" height="56" rx="6" fill="#faf7f2"/>
  <rect x="376" y="232" width="144" height="56" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <rect x="384" y="240" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="412" y="248" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
  <text x="448" y="264" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">filter</text>
  <text x="448" y="280" fill="#57534e" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">未执行</text>

  <rect x="544" y="232" width="144" height="56" rx="6" fill="#faf7f2"/>
  <rect x="544" y="232" width="144" height="56" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <rect x="552" y="240" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
  <text x="580" y="248" fill="#57534e" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">TERM</text>
  <text x="616" y="264" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">first</text>
  <text x="616" y="280" fill="#57534e" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">触发计算</text>

  <rect x="720" y="128" width="200" height="160" rx="6" fill="#faf7f2"/>
  <rect x="720" y="128" width="200" height="160" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
  <text x="744" y="160" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif">中间集合数量</text>
  <line x1="744" y1="172" x2="896" y2="172" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <text x="744" y="200" fill="#1c1917" font-size="12" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif">集合</text>
  <text x="896" y="200" fill="#57534e" font-size="20" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="end">3</text>
  <text x="744" y="228" fill="#1c1917" font-size="12" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif">序列</text>
  <text x="896" y="228" fill="#57534e" font-size="20" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="end">0</text>
  <text x="744" y="260" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="0.08em">NO INTERMEDIATE LIST</text>

  <rect x="320" y="296" width="88" height="16" fill="#faf7f2"/>
  <text x="364" y="308" fill="#b5523a" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">SHORT-CIRCUIT</text>
</svg>
